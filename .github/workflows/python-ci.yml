name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes

      - name: Syntax check all Python files
        run: |
          python -m compileall -q app streamlit_app run.py
          echo "✅ All Python files compile successfully."

      - name: Static lint check (pyflakes)
        run: |
          pyflakes app streamlit_app/app.py run.py
          echo "✅ Pyflakes check completed."

